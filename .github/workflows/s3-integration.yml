name: S3 Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  minio:
    runs-on: ubuntu-latest
    services:
      minio:
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl --fail http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        command: server /data
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.4.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run MinIO contract test
        env:
          S3_INTEGRATION: '1'
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_BUCKET: files-integration-${{ github.run_id }}
        run: pnpm exec vitest run packages/storage-s3/src/integration.test.ts --reporter=verbose
