name: S3 Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  minio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.4.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Start pinned public MinIO server
        run: |
          docker run --detach --rm --name file-server-minio --publish 9000:9000 --env MINIO_ROOT_USER=minioadmin --env MINIO_ROOT_PASSWORD=minioadmin docker.io/coollabsio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a4938f37f1be1841b8e7b627ad0207b265345fd0d063e42d7410c78af0e63e68 server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then break; fi
            if [ "$attempt" -eq 30 ]; then docker logs file-server-minio; exit 1; fi
            sleep 1
          done
      - name: Run MinIO contract test
        env:
          S3_INTEGRATION: '1'
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_BUCKET: files-integration-${{ github.run_id }}
        run: pnpm exec vitest run packages/storage-s3/src/integration.test.ts --reporter=verbose
